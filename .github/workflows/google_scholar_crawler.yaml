name: Get Citation Data

on:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab
  schedule:
    - cron: '0 8 * * *'   # daily (~31 SerpApi searches a month)

permissions:
  contents: write         # lets the job push the google-scholar-stats branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Fetch citation data from SerpApi
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      run: |
        cd ./google_scholar_crawler
        python3 main.py

    - name: Publish to the google-scholar-stats branch
      run: |
        cd ./google_scholar_crawler/results
        git init -q
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git add *.json
        git commit -q -m "Updated Citation Data"
        git push --force -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
